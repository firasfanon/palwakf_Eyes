name: Pal Eyes R9.0.1 reconstructed candidate

on:
  push:
    branches:
      - "sync/pal-eyes-r9.0.1-session-reconstructed-20260802"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.0"
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Targeted Dart format gate
        run: |
          dart format --output=none --set-exit-if-changed             lib/app/theme/app_theme.dart             lib/core/widgets/public_experience_maturity.dart             lib/core/widgets/direct_flutter_maturity_r9.dart             lib/features/discovery/presentation/discovery_screen.dart             lib/features/home/presentation/home_screen.dart             lib/features/map/presentation/map_screen.dart             lib/features/places/presentation/place_detail_screen.dart             lib/features/places/presentation/places_screen.dart             lib/features/stories/presentation/stories_screen.dart             lib/features/stories/presentation/story_detail_screen.dart             test/pal_eyes_media_stage_bounded_layout_test.dart             test/direct_flutter_maturity_r9_contract_test.dart             test/direct_flutter_maturity_r9_widget_test.dart

      - name: Baseline verifier
        run: |
          python3 tools/verify_session_reconstructed_r9_0_1.py             --require-finalized

      - name: Flutter analyze
        run: flutter analyze --no-pub

      - name: Flutter tests
        run: flutter test --no-pub --reporter expanded

      - name: Whitespace gate
        run: git diff --check
