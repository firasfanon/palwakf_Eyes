name: Pal Eyes staging credentials read-only preflight (single owner)

# Only bounded identity and credential GET/link; no migration, backup, or artifact.
on:
  workflow_dispatch:
    inputs:
      confirm_read_only:
        description: "Type PAL_EYES_CREDENTIAL_PREFLIGHT_ONLY"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pal-eyes-staging-credentials-readonly
  cancel-in-progress: false

jobs:
  credential-preflight:
    runs-on: ubuntu-24.04
    environment: pal-eyes-staging
    timeout-minutes: 15
    env:
      EXPECTED_REPOSITORY: firasfanon/palwakf_Eyes
      EXPECTED_OWNER: firasfanon
      EXPECTED_ORG_ID: iffwrnhqiwyallmkceca
      EXPECTED_STAGING_REF: esojldjeisjgzievhgyj
      EXPECTED_STAGING_BRANCH: task/pal-eyes-staging-p0-hardening-v1
      PROJECT_REF_ALLOWLIST: ${{ vars.PAL_EYES_STAGING_PROJECT_REF }}
      FORBIDDEN_REFS: ${{ vars.PAL_EYES_FORBIDDEN_PROJECT_REFS }}
      SQL_APPLY_ALLOWED: ${{ vars.PAL_EYES_STAGING_SQL_APPLY_ALLOWED }}
      READONLY_CONFIRMATION: ${{ inputs.confirm_read_only }}

    steps:
      - name: Fail-closed identity and policy preflight (no database access)
        shell: bash
        env:
          PROJECT_REF_SECRET: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$READONLY_CONFIRMATION" = "PAL_EYES_CREDENTIAL_PREFLIGHT_ONLY"
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_ACTOR" = "$EXPECTED_OWNER"
          test "$GITHUB_REF_NAME" = "$EXPECTED_STAGING_BRANCH"
          test "$PROJECT_REF_ALLOWLIST" = "$EXPECTED_STAGING_REF"
          test -n "$PROJECT_REF_SECRET"
          test "$PROJECT_REF_SECRET" = "$EXPECTED_STAGING_REF"
          test "$SQL_APPLY_ALLOWED" = "false"
          test -n "$FORBIDDEN_REFS"
          normalized=" $(printf '%s' "$FORBIDDEN_REFS" | tr ',' ' ') "
          for forbidden in nghxemiygpjywkodrdwx lyeryfsrhrxuepuqepgi kzcpnyvrgxphgbwhyntr; do
            [[ "$normalized" == *" $forbidden "* ]] || {
              echo "PREFLIGHT_DENYLIST=FAIL"
              exit 1
            }
          done
          [[ "$normalized" != *" $EXPECTED_STAGING_REF "* ]] || {
            echo "PREFLIGHT_CONTRADICTORY_POLICY=FAIL"
            exit 1
          }
          echo "SOLO_OWNER_EXACT_IDENTITY_AND_NO_SQL_POLICY=PASS"

      - name: Check Supabase PAT with exact read-only Management API request
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "SUPABASE_PAT_PRESENT=FAIL"
            exit 1
          }
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          status="$(curl --silent --show-error --max-time 30 \
            --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_STAGING_REF")" || {
            echo "SUPABASE_MANAGEMENT_API_GET=FAIL"
            exit 1
          }
          test "$status" = "200" || {
            echo "SUPABASE_MANAGEMENT_API_GET=FAIL"
            exit 1
          }
          jq -e --arg ref "$EXPECTED_STAGING_REF" --arg org "$EXPECTED_ORG_ID" \
            '(.id == $ref or .ref == $ref) and .organization_id == $org and .status == "ACTIVE_HEALTHY"' \
            "$response" >/dev/null || {
            echo "SUPABASE_MANAGEMENT_PROJECT_OR_ORG=FAIL"
            exit 1
          }
          echo "SUPABASE_PAT_EXACT_PROJECT_READ=PASS"

      - name: Checkout isolated source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install known Supabase CLI without secrets
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Verify staging DB credential via link only (no SQL apply)
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          supabase link --project-ref "$EXPECTED_STAGING_REF" \
            --password "$SUPABASE_DB_PASSWORD" >/dev/null 2>&1 || {
            echo "SUPABASE_STAGING_DB_LINK=FAIL"
            exit 1
          }
          echo "SUPABASE_STAGING_DB_LINK=PASS"
          echo "HOSTED_DRY_RUN=NOT_RUN"
          echo "SQL_MIGRATION_APPLY=NOT_RUN"
          echo "DATABASE_DUMP=NOT_RUN"
          echo "WORKFLOW_ARTIFACT_UPLOAD=NOT_RUN"

      - name: Exact staging Session Pooler PostgreSQL auth probe (SELECT 1 only)
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
          SESSION_POOLER_HOST: ${{ vars.PAL_EYES_STAGING_SESSION_POOLER_HOST }}
        run: |
          set -euo pipefail
          set +x
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF_NAME" = "$EXPECTED_STAGING_BRANCH"
          test "$EXPECTED_STAGING_REF" = "esojldjeisjgzievhgyj"
          test "$PROJECT_REF_ALLOWLIST" = "$EXPECTED_STAGING_REF"
          test "$SQL_APPLY_ALLOWED" = "false"
          test "$SESSION_POOLER_HOST" = "aws-0-ap-southeast-2.pooler.supabase.com"
          test -n "$PGPASSWORD" || { echo "AUTH_ONLY_RESULT=SECRET_MISSING"; exit 1; }
          command -v psql >/dev/null 2>&1 || { echo "AUTH_ONLY_RESULT=PSQL_UNAVAILABLE"; exit 1; }
          export PGPASSWORD
          export PGCONNECT_TIMEOUT=10
          auth_error="$(mktemp)"
          trap 'rm -f "$auth_error"; unset PGPASSWORD' EXIT
          if ! auth_result="$(psql -X -w -qAt -v ON_ERROR_STOP=1 \
            "host=$SESSION_POOLER_HOST port=5432 dbname=postgres user=postgres.$EXPECTED_STAGING_REF sslmode=require connect_timeout=10" \
            -c 'SELECT 1;' 2>"$auth_error")"; then
            if grep -qi 'password authentication failed' "$auth_error"; then
              echo "AUTH_ONLY_RESULT=POSTGRES_AUTH_REJECTED"
            else
              echo "AUTH_ONLY_RESULT=OTHER_CONNECTION_FAILURE"
            fi
            exit 1
          fi
          test "$auth_result" = "1" || { echo "AUTH_ONLY_RESULT=UNEXPECTED_QUERY_OUTPUT"; exit 1; }
          echo "AUTH_ONLY_RESULT=PASS"
          echo "AUTH_ONLY_QUERY=SELECT_1"
          echo "BACKUP=NOT_RUN"
          echo "MIGRATIONS=NOT_RUN"
          echo "SQL_APPLY=NOT_RUN"
