# Supabase CLI configuration for the LOCAL / CI stack only.
# It never points at a hosted project. Staging is linked separately through
# .github/workflows/supabase_staging_migrations.yml with owner-held secrets.
project_id = "pal-eyes-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public", "pal_eyes"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed/*.sql"]

[studio]
enabled = false

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:8702"
additional_redirect_urls = ["http://127.0.0.1:8702/sign-in"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# D3: invite-only. No public sign-up at the API level.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
# Provider switch: must stay true or email+password login is disabled.
# Public sign-up is blocked by [auth].enable_signup = false above.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
